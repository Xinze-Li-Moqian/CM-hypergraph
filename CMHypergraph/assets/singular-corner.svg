<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="sans-serif" font-size="13" fill="none" stroke="currentColor">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>

  <!-- time axis -->
  <line x1="42" y1="400" x2="42" y2="85" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="42" y="70" fill="currentColor" stroke="none" text-anchor="middle">time</text>

  <!-- singular time line -->
  <line x1="100" y1="240" x2="585" y2="240" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="565" y="228" fill="currentColor" stroke="none" text-anchor="end">singular time</text>

  <!-- the L-shaped chart: full product on the left, upper quadrant on the right -->
  <path d="M 130 100 L 130 400 L 330 400 L 330 240 L 560 240 L 560 100 Z"
        fill="currentColor" fill-opacity="0.05" stroke-width="2"/>

  <!-- exposed region: the boundary edge at the singular time -->
  <line x1="330" y1="240" x2="560" y2="240" stroke-width="4.5" stroke-linecap="round"/>

  <!-- discarded material below-right: ghost flow lines ending before T -->
  <line x1="400" y1="400" x2="400" y2="266" stroke-width="1.2" opacity="0.35"/>
  <line x1="455" y1="400" x2="455" y2="262" stroke-width="1.2" opacity="0.35"/>
  <line x1="510" y1="400" x2="510" y2="266" stroke-width="1.2" opacity="0.35"/>
  <line x1="395" y1="266" x2="405" y2="266" stroke-width="1.6" opacity="0.35"/>
  <line x1="450" y1="262" x2="460" y2="262" stroke-width="1.6" opacity="0.35"/>
  <line x1="505" y1="266" x2="515" y2="266" stroke-width="1.6" opacity="0.35"/>
  <text x="455" y="330" fill="currentColor" stroke="none" text-anchor="middle" opacity="0.75">discarded material:</text>
  <text x="455" y="346" fill="currentColor" stroke="none" text-anchor="middle" opacity="0.75">flow lines end before the singular time</text>

  <!-- smooth point: two-sided product neighbourhood -->
  <rect x="200" y="270" width="60" height="60" stroke-dasharray="3 3" opacity="0.7"/>
  <circle cx="230" cy="300" r="4.5" fill="currentColor" stroke="none"/>
  <line x1="230" y1="348" x2="230" y2="256" stroke-width="1.2" opacity="0.85" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
  <text x="230" y="372" fill="currentColor" stroke="none" text-anchor="middle">smooth point:</text>
  <text x="230" y="388" fill="currentColor" stroke="none" text-anchor="middle">flow both ways</text>

  <!-- exposed point: half-open forward neighbourhood on the boundary edge -->
  <rect x="420" y="190" width="60" height="50" stroke-dasharray="3 3" opacity="0.7"/>
  <circle cx="450" cy="240" r="4.5" fill="currentColor" stroke="none"/>
  <line x1="450" y1="236" x2="450" y2="150" stroke-width="1.2" opacity="0.85" marker-end="url(#arr2)"/>
  <text x="450" y="176" fill="currentColor" stroke="none" text-anchor="middle">exposed point: born here,</text>
  <text x="450" y="160" fill="currentColor" stroke="none" text-anchor="middle">flow only forward</text>

  <!-- the singular point at the corner -->
  <circle cx="330" cy="240" r="5.5" fill="currentColor" stroke="none"/>
  <text x="248" y="212" fill="currentColor" stroke="none" text-anchor="end">singular point:</text>
  <text x="248" y="228" fill="currentColor" stroke="none" text-anchor="end">the corner</text>
  <line x1="252" y1="220" x2="322" y2="236" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- region captions -->
  <text x="230" y="125" fill="currentColor" stroke="none" text-anchor="middle">surviving material</text>
  <text x="445" y="125" fill="currentColor" stroke="none" text-anchor="middle">the cap: new material</text>

  <!-- bottom caption -->
  <text x="345" y="428" fill="currentColor" stroke="none" text-anchor="middle">near the seam: a full product on one side, a half-open product on the other</text>
</svg>

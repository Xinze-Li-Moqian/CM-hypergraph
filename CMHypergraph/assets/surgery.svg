    <path d="M60,120 C 60,70 160,70 175,105 C 190,112 230,112 245,105 C 260,70 360,70 360,120 C 360,170 260,170 245,135 C 230,128 190,128 175,135 C 160,170 60,170 60,120 Z"/>

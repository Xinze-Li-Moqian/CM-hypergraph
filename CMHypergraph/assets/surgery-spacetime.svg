<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" font-family="sans-serif" font-size="13" fill="none" stroke="currentColor">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>

  <!-- time axis -->
  <line x1="50" y1="410" x2="50" y2="75" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="50" y="60" fill="currentColor" stroke="none" text-anchor="middle">time</text>
  <text x="64" y="100" fill="currentColor" stroke="none" font-style="italic">χ</text>

  <!-- singular time line -->
  <line x1="110" y1="230" x2="550" y2="230" stroke-dasharray="6 4" opacity="0.55"/>
  <text x="556" y="234" fill="currentColor" stroke="none">singular time</text>

  <!-- world-sheet outer walls (continuous across T) -->
  <path d="M 215 410 C 205 340, 215 300, 237 230 C 250 180, 250 120, 250 70" stroke-width="2"/>
  <path d="M 445 410 C 455 340, 445 300, 423 230 C 410 180, 410 120, 410 70" stroke-width="2"/>
  <!-- bottom of the pre-surgery slab -->
  <path d="M 215 410 C 290 420, 370 420, 445 410" stroke-width="2"/>

  <!-- inner walls above T -->
  <path d="M 305 70 L 305 210" stroke-width="2"/>
  <path d="M 355 70 L 355 210" stroke-width="2"/>

  <!-- surgery caps: bold hooks rounding off the two components at time T -->
  <path d="M 305 210 C 305 222, 312 230, 324 230" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 355 210 C 355 222, 348 230, 336 230" stroke-width="4.5" stroke-linecap="round"/>

  <!-- singular points: frontier where cap meets the surviving slice -->
  <circle cx="305" cy="210" r="4" fill="currentColor" stroke="none"/>
  <circle cx="355" cy="210" r="4" fill="currentColor" stroke="none"/>

  <!-- smooth flow lines crossing T -->
  <line x1="272" y1="400" x2="272" y2="95" stroke-width="1.2" opacity="0.8" marker-end="url(#arr)"/>
  <line x1="388" y1="400" x2="388" y2="95" stroke-width="1.2" opacity="0.8" marker-end="url(#arr)"/>

  <!-- discarded neck flow lines: end before T -->
  <line x1="316" y1="400" x2="316" y2="248" stroke-width="1.2" opacity="0.8"/>
  <line x1="330" y1="400" x2="330" y2="244" stroke-width="1.2" opacity="0.8"/>
  <line x1="344" y1="400" x2="344" y2="248" stroke-width="1.2" opacity="0.8"/>
  <line x1="311" y1="248" x2="321" y2="248" stroke-width="1.6"/>
  <line x1="325" y1="244" x2="335" y2="244" stroke-width="1.6"/>
  <line x1="339" y1="248" x2="349" y2="248" stroke-width="1.6"/>

  <!-- flow line born at the cap -->
  <path d="M 352 226 C 354 200, 362 175, 362 140" stroke-width="1.2" opacity="0.8" marker-end="url(#arr)"/>

  <!-- labels, left margin -->
  <text x="68" y="132" fill="currentColor" stroke="none">smooth points:</text>
  <text x="68" y="148" fill="currentColor" stroke="none">product charts,</text>
  <text x="68" y="164" fill="currentColor" stroke="none">ordinary Ricci flow</text>
  <line x1="196" y1="143" x2="246" y2="140" stroke-dasharray="2 3" opacity="0.6"/>

  <text x="68" y="368" fill="currentColor" stroke="none">before surgery:</text>
  <text x="68" y="384" fill="currentColor" stroke="none">one connected slice</text>

  <!-- labels, right margin -->
  <text x="470" y="128" fill="currentColor" stroke="none">flow lines born at</text>
  <text x="470" y="144" fill="currentColor" stroke="none">the cap: exposed points</text>
  <line x1="466" y1="138" x2="368" y2="160" stroke-dasharray="2 3" opacity="0.6"/>

  <text x="470" y="192" fill="currentColor" stroke="none">singular points:</text>
  <text x="470" y="208" fill="currentColor" stroke="none">frontier 2-spheres</text>
  <line x1="466" y1="200" x2="362" y2="209" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- top and bottom captions -->
  <text x="330" y="45" fill="currentColor" stroke="none" text-anchor="middle">after surgery: two components, each smoothly continuing</text>
  <text x="330" y="438" fill="currentColor" stroke="none" text-anchor="middle">the discarded neck: its flow lines end before the singular time</text>
</svg>
